<!DOCTYPE html>
<html lang="ur" class="dark">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>VideoTube - Professional Player</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      darkMode: 'class',
      theme: {
        extend: {
          colors: {
            ytDark: '#0f0f0f',
            ytCard: '#181818',
            ytRed: '#FF0000'
          }
        }
      }
    }
  </script>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <script src="https://www.youtube.com/iframe_api"></script>
  <style>
    /* یوٹیوب کے کسی بھی پوشیدہ واٹر مارک یا کلک آؤٹ کو بلاک کرنے کی کسٹم شیلڈز */
    .yt-shield-top {
      position: absolute;
      top: 0;
      left: 0;
      right: 0;
      height: 60px;
      z-index: 20;
      pointer-events: auto;
      background: transparent;
    }
    .yt-shield-bottom {
      position: absolute;
      bottom: 0;
      left: 0;
      right: 0;
      height: 60px;
      z-index: 20;
      pointer-events: auto;
      background: transparent;
    }
    /* کسٹم پروگریس بار رینج */
    input[type=range]::-webkit-slider-thumb {
      width: 14px;
      height: 14px;
      border-radius: 50%;
      background: #ff0000;
      cursor: pointer;
      -webkit-appearance: none;
    }
  </style>
</head>
<body class="bg-[#0f0f0f] text-white font-sans antialiased min-h-screen flex flex-col selection:bg-red-600">

  <!-- Header -->
  <header class="sticky top-0 z-40 bg-[#0f0f0f]/95 border-b border-neutral-800 px-4 py-2.5 flex items-center justify-between">
    <div class="flex items-center space-x-2.5 cursor-pointer" onclick="filterCat('All'); closePlayer();">
      <div class="bg-red-600 w-8 h-6 rounded-lg flex items-center justify-center shadow-lg shadow-red-600/30">
        <i class="fa-solid fa-play text-white text-xs"></i>
      </div>
      <span class="text-xl font-bold tracking-tight">VideoTube</span>
    </div>

    <!-- Search Bar -->
    <div class="flex-1 max-w-lg mx-4">
      <div class="relative">
        <input 
          id="searchInput" 
          type="text" 
          placeholder="سرچ کریں..." 
          onkeyup="searchVideos()"
          class="w-full bg-[#181818] border border-neutral-700 rounded-full py-1.5 pl-4 pr-10 text-sm focus:outline-none focus:border-red-500 transition placeholder:text-neutral-500"
        />
        <i class="fa-solid fa-magnifying-glass text-neutral-400 absolute right-3.5 top-2.5 text-sm"></i>
      </div>
    </div>

    <!-- User Profile Icon -->
    <div class="flex items-center space-x-3">
      <button class="w-8 h-8 rounded-full bg-neutral-800 hover:bg-neutral-700 flex items-center justify-center text-neutral-300">
        <i class="fa-regular fa-bell text-sm"></i>
      </button>
      <div class="w-8 h-8 rounded-full bg-gradient-to-tr from-red-600 to-red-400 flex items-center justify-center font-bold text-xs">
        U
      </div>
    </div>
  </header>

  <!-- Categories Bar -->
  <div class="sticky top-[53px] z-30 bg-[#0f0f0f]/95 backdrop-blur flex space-x-2 px-4 py-2.5 overflow-x-auto border-b border-neutral-800/80 text-xs no-scrollbar">
    <button onclick="filterCat('All')" class="cat-btn px-3.5 py-1.5 rounded-lg bg-white text-black font-semibold transition">All</button>
    <button onclick="filterCat('Tech')" class="cat-btn px-3.5 py-1.5 rounded-lg bg-neutral-800 text-neutral-300 hover:bg-neutral-700 transition">Tech</button>
    <button onclick="filterCat('Gaming')" class="cat-btn px-3.5 py-1.5 rounded-lg bg-neutral-800 text-neutral-300 hover:bg-neutral-700 transition">Gaming</button>
    <button onclick="filterCat('Music')" class="cat-btn px-3.5 py-1.5 rounded-lg bg-neutral-800 text-neutral-300 hover:bg-neutral-700 transition">Music</button>
    <button onclick="filterCat('Movies')" class="cat-btn px-3.5 py-1.5 rounded-lg bg-neutral-800 text-neutral-300 hover:bg-neutral-700 transition">Movies</button>
  </div>

  <!-- 100% Real Custom Professional Video Player (No YouTube Branding) -->
  <div id="playerSection" class="hidden max-w-5xl mx-auto w-full p-4 lg:p-6 transition-all duration-300">
    <div id="videoContainer" class="relative group aspect-video w-full rounded-2xl overflow-hidden bg-black shadow-2xl border border-neutral-800">
      
      <!-- YouTube Video Container (controls=0 se YouTube کا لوگو اور پاپ اپس بند ہو جاتے ہیں) -->
      <div id="ytPlayerDiv" class="w-full h-full pointer-events-none"></div>

      <!-- Invisible Shield (روکتی ہے کہ کوئی غلطی سے یوٹیوب سائٹ پر نہ جائے) -->
      <div class="yt-shield-top"></div>
      <div class="yt-shield-bottom"></div>

      <!-- Click to Play/Pause on whole screen -->
      <div class="absolute inset-0 z-20 cursor-pointer" onclick="togglePlayPause()"></div>

      <!-- Center Play/Pause Indicator -->
      <div id="centerPlayIcon" class="absolute inset-0 z-30 flex items-center justify-center pointer-events-none opacity-0 transition-opacity duration-200">
        <div class="w-16 h-16 bg-black/70 backdrop-blur rounded-full flex items-center justify-center text-white text-2xl shadow-xl">
          <i id="centerIcon" class="fa-solid fa-play ml-1"></i>
        </div>
      </div>

      <!-- Custom Professional Bottom Control Bar (100% Real Website Controls) -->
      <div id="customControls" class="absolute bottom-0 left-0 right-0 z-30 bg-gradient-to-t from-black/95 via-black/60 to-transparent p-3 pt-8 transition-opacity duration-300 opacity-100">
        <!-- Progress Slider Bar -->
        <div class="relative w-full flex items-center mb-2">
          <input 
            id="progressBar" 
            type="range" 
            min="0" 
            max="100" 
            value="0" 
            step="0.1" 
            oninput="seekVideo(this.value)" 
            class="w-full h-1 bg-neutral-700 rounded-lg appearance-none cursor-pointer accent-red-600"
          />
        </div>

        <!-- Controls Row -->
        <div class="flex items-center justify-between text-white text-sm">
          <div class="flex items-center space-x-4">
            <!-- Play/Pause Button -->
            <button onclick="togglePlayPause()" class="hover:text-red-500 transition">
              <i id="playPauseIcon" class="fa-solid fa-play text-lg"></i>
            </button>

            <!-- Volume Mute Button -->
            <button onclick="toggleMute()" class="hover:text-neutral-300 transition">
              <i id="volumeIcon" class="fa-solid fa-volume-high text-base"></i>
            </button>

            <!-- Time Display -->
            <span id="timeDisplay" class="text-xs text-neutral-300 font-mono tracking-wider">00:00 / 00:00</span>
          </div>

          <div class="flex items-center space-x-3">
            <!-- Fullscreen Button -->
            <button onclick="toggleFullScreen()" class="hover:text-red-500 transition p-1">
              <i class="fa-solid fa-expand text-base"></i>
            </button>
          </div>
        </div>
      </div>
    </div>

    <!-- Video Info Section -->
    <div class="mt-4">
      <h1 id="playerTitle" class="text-xl md:text-2xl font-bold text-neutral-100 leading-snug"></h1>
      
      <div class="flex flex-wrap items-center justify-between gap-4 mt-3 pb-4 border-b border-neutral-800">
        <!-- Channel Info -->
        <div class="flex items-center space-x-3">
          <div id="playerChannelAvatar" class="w-10 h-10 rounded-full bg-neutral-700 flex items-center justify-center font-bold text-sm text-white">C</div>
          <div>
            <h3 id="playerChannel" class="font-bold text-sm text-white"></h3>
            <p class="text-xs text-neutral-400">1.2M subscribers</p>
          </div>
          <button class="bg-white hover:bg-neutral-200 text-black px-4 py-2 rounded-full font-bold text-xs transition ml-2">Subscribe</button>
        </div>

        <!-- Action Buttons -->
        <div class="flex items-center space-x-2 text-xs">
          <div class="flex items-center bg-neutral-800 rounded-full overflow-hidden">
            <button class="flex items-center space-x-1.5 px-3 py-2 hover:bg-neutral-700 transition text-neutral-200">
              <i class="fa-regular fa-thumbs-up"></i>
              <span>124K</span>
            </button>
            <div class="w-[1px] h-4 bg-neutral-700"></div>
            <button class="px-3 py-2 hover:bg-neutral-700 transition text-neutral-200">
              <i class="fa-regular fa-thumbs-down"></i>
            </button>
          </div>
          <button onclick="copyShareLink()" class="flex items-center space-x-1.5 bg-neutral-800 hover:bg-neutral-700 px-3.5 py-2 rounded-full text-neutral-200 transition">
            <i class="fa-solid fa-share"></i>
            <span>Share</span>
          </button>
          <button onclick="closePlayer()" class="bg-neutral-800 hover:bg-neutral-700 px-3 py-2 rounded-full text-neutral-400 hover:text-white transition">
            <i class="fa-solid fa-xmark mr-1"></i> بند کریں
          </button>
        </div>
      </div>

      <!-- Description Box -->
      <div class="mt-3 bg-[#181818] p-4 rounded-xl text-xs text-neutral-300 leading-relaxed border border-neutral-800/60">
        <p id="playerViews" class="font-bold text-neutral-200 mb-1"></p>
        <p id="playerDesc">Enjoy watching this video in high definition on VideoTube.</p>
      </div>
    </div>
  </div>

  <!-- Video Grid Feed -->
  <main class="flex-1 p-4 lg:p-6 max-w-7xl mx-auto w-full">
    <div id="videoGrid" class="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-3 xl:grid-cols-4 gap-x-4 gap-y-6"></div>
  </main>

  <script>
    const DEFAULT_VIDEOS = [
      { id: 1, videoId: "aqz-KE-bpKQ", title: "Big Buck Bunny 4K (Open Animation)", channel: "Blender Animation", cat: "Movies", views: "15.4M views", time: "3 days ago", duration: "9:56", desc: "A large and lovable rabbit deals with bullying forest creatures in this iconic classic." },
      { id: 2, videoId: "R6MlUcmOul8", title: "Tears of Steel - Sci-Fi VFX Short in 4K", channel: "Blender VFX Lab", cat: "Tech", views: "4.9M views", time: "1 week ago", duration: "12:14", desc: "Exploring cutting-edge open-source visual effects in a dystopian future." },
      { id: 3, videoId: "jfKfPfyJRdk", title: "Lofi Hip Hop Radio - Beats to Relax / Study", channel: "Lofi Girl", cat: "Music", views: "28.4M views", time: "Live", duration: "LIVE", desc: "Relaxing lofi music stream for studying, working, coding, or sleeping peacefully." },
      { id: 4, videoId: "8X2kIfS6fb8", title: "Cyberpunk 2077 - Next-Gen Ray Tracing Ultra", channel: "Digital Foundry", cat: "Gaming", views: "6.7M views", time: "2 days ago", duration: "15:40", desc: "Deep dive into ray tracing overdrive mode running on RTX 4090 at 4K." }
    ];

    function getAllVideos() {
      const stored = localStorage.getItem('videotube_admin_videos');
      const adminVideos = stored ? JSON.parse(stored) : [];
      return [...adminVideos, ...DEFAULT_VIDEOS];
    }

    let currentCat = "All";
    let activeVidId = null;
    let ytPlayer = null;
    let isPlaying = false;
    let updateInterval = null;

    function renderVideos() {
      const grid = document.getElementById('videoGrid');
      grid.innerHTML = '';
      const query = document.getElementById('searchInput').value.toLowerCase().trim();
      const allVideos = getAllVideos();

      const filtered = allVideos.filter(v => {
        const matchesCat = currentCat === 'All' || v.cat.toLowerCase() === currentCat.toLowerCase();
        const matchesQuery = query === '' || 
          v.title.toLowerCase().includes(query) || 
          v.channel.toLowerCase().includes(query);
        return matchesCat && matchesQuery;
      });

      filtered.forEach(v => {
        const card = document.createElement('div');
        card.className = "cursor-pointer group flex flex-col space-y-2.5";
        card.onclick = () => playVideo(v);
        card.innerHTML = `
          <div class="relative aspect-video rounded-xl overflow-hidden bg-neutral-900 border border-neutral-800/80">
            <img src="https://img.youtube.com/vi/${v.videoId}/hqdefault.jpg" class="w-full h-full object-cover group-hover:scale-105 transition duration-300" alt="${v.title}">
            <span class="absolute bottom-2 right-2 text-[11px] font-bold px-1.5 py-0.5 rounded ${v.duration === 'LIVE' ? 'bg-red-600' : 'bg-black/80'} text-white">${v.duration || '10:00'}</span>
          </div>
          <div class="flex space-x-2.5 items-start">
            <div class="w-9 h-9 rounded-full bg-neutral-800 flex items-center justify-center font-bold text-xs text-neutral-200 flex-shrink-0 border border-neutral-700/50">
              ${v.channel ? v.channel[0].toUpperCase() : 'V'}
            </div>
            <div class="flex-1 min-w-0">
              <h4 class="text-xs font-semibold text-neutral-100 line-clamp-2 leading-snug group-hover:text-red-400 transition">${v.title}</h4>
              <p class="text-[11px] text-neutral-400 mt-1">${v.channel || 'Video Creator'}</p>
              <p class="text-[11px] text-neutral-500">${v.views || '1.2K views'} • ${v.time || 'Recently'}</p>
            </div>
          </div>
        `;
        grid.appendChild(card);
      });
    }

    function playVideo(v) {
      activeVidId = v.videoId;
      const playerSection = document.getElementById('playerSection');
      playerSection.classList.remove('hidden');

      document.getElementById('playerTitle').innerText = v.title;
      document.getElementById('playerChannel').innerText = v.channel || 'Video Creator';
      document.getElementById('playerChannelAvatar').innerText = v.channel ? v.channel[0].toUpperCase() : 'V';
      document.getElementById('playerViews').innerText = `${v.views || '1.2K views'} • ${v.time || 'Recently'}`;
      document.getElementById('playerDesc').innerText = v.desc || 'Enjoy watching this video in high definition on VideoTube.';

      playerSection.scrollIntoView({ behavior: 'smooth' });

      // Create or update YouTube player with controls: 0 (NO YOUTUBE LOGO, NO SUGGESTION POPUPS)
      if (ytPlayer && ytPlayer.loadVideoById) {
        ytPlayer.loadVideoById(v.videoId);
      } else {
        ytPlayer = new YT.Player('ytPlayerDiv', {
          height: '100%',
          width: '100%',
          videoId: v.videoId,
          playerVars: {
            'autoplay': 1,
            'controls': 0,        // یوٹیوب کا اپنا کنٹرول بار، یوٹیوب لوگو اور پاپ اپس بند!
            'modestbranding': 1,
            'rel': 0,
            'iv_load_policy': 3,
            'playsinline': 1,
            'disablekb': 1,
            'fs': 0
          },
          events: {
            'onReady': onPlayerReady,
            'onStateChange': onPlayerStateChange
          }
        });
      }
    }

    function onPlayerReady(event) {
      event.target.playVideo();
      startProgressTracking();
    }

    function onPlayerStateChange(event) {
      if (event.data === YT.PlayerState.PLAYING) {
        isPlaying = true;
        document.getElementById('playPauseIcon').className = "fa-solid fa-pause text-lg";
        startProgressTracking();
      } else {
        isPlaying = false;
        document.getElementById('playPauseIcon').className = "fa-solid fa-play text-lg";
        clearInterval(updateInterval);
      }
    }

    function togglePlayPause() {
      if (!ytPlayer) return;
      if (isPlaying) {
        ytPlayer.pauseVideo();
        showCenterAnimation("fa-pause");
      } else {
        ytPlayer.playVideo();
        showCenterAnimation("fa-play");
      }
    }

    function showCenterAnimation(iconClass) {
      const icon = document.getElementById('centerIcon');
      const box = document.getElementById('centerPlayIcon');
      icon.className = `fa-solid ${iconClass} ${iconClass === 'fa-play' ? 'ml-1' : ''}`;
      box.classList.remove('opacity-0');
      setTimeout(() => box.classList.add('opacity-0'), 500);
    }

    function toggleMute() {
      if (!ytPlayer) return;
      const volIcon = document.getElementById('volumeIcon');
      if (ytPlayer.isMuted()) {
        ytPlayer.unMute();
        volIcon.className = "fa-solid fa-volume-high text-base";
      } else {
        ytPlayer.mute();
        volIcon.className = "fa-solid fa-volume-xmark text-base text-red-500";
      }
    }

    function startProgressTracking() {
      clearInterval(updateInterval);
      updateInterval = setInterval(() => {
        if (!ytPlayer || !ytPlayer.getCurrentTime) return;
        const current = ytPlayer.getCurrentTime() || 0;
        const duration = ytPlayer.getDuration() || 1;
        const percent = (current / duration) * 100;
        document.getElementById('progressBar').value = percent;
        document.getElementById('timeDisplay').innerText = `${formatTime(current)} / ${formatTime(duration)}`;
      }, 500);
    }

    function seekVideo(val) {
      if (!ytPlayer || !ytPlayer.getDuration) return;
      const duration = ytPlayer.getDuration();
      const seekTo = (val / 100) * duration;
      ytPlayer.seekTo(seekTo, true);
    }

    function formatTime(seconds) {
      const s = Math.floor(seconds % 60);
      const m = Math.floor((seconds / 60) % 60);
      const h = Math.floor(seconds / 3600);
      const pad = (num) => num.toString().padStart(2, '0');
      if (h > 0) {
        return `${h}:${pad(m)}:${pad(s)}`;
      }
      return `${pad(m)}:${pad(s)}`;
    }

    function toggleFullScreen() {
      const container = document.getElementById('videoContainer');
      if (!document.fullscreenElement) {
        container.requestFullscreen().catch(() => {});
      } else {
        document.exitFullscreen().catch(() => {});
      }
    }

    function closePlayer() {
      document.getElementById('playerSection').classList.add('hidden');
      if (ytPlayer && ytPlayer.stopVideo) {
        ytPlayer.stopVideo();
      }
      clearInterval(updateInterval);
      activeVidId = null;
    }

    function filterCat(cat) {
      currentCat = cat;
      document.querySelectorAll('.cat-btn').forEach(b => {
        if (b.innerText === cat) {
          b.className = "cat-btn px-3.5 py-1.5 rounded-lg bg-white text-black font-semibold transition";
        } else {
          b.className = "cat-btn px-3.5 py-1.5 rounded-lg bg-neutral-800 text-neutral-300 hover:bg-neutral-700 transition";
        }
      });
      renderVideos();
    }

    function searchVideos() {
      renderVideos();
    }

    function copyShareLink() {
      if (activeVidId) {
        navigator.clipboard.writeText(window.location.origin + '?v=' + activeVidId);
        alert('ویڈیو لنک کاپی ہو گیا!');
      }
    }

    renderVideos();

    window.addEventListener('storage', () => {
      renderVideos();
    });
  </script>
</body>
</html>
