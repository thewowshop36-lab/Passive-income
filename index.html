<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>NaseebZone - Pakistan's Trusted Lucky Draws</title>
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: { neon: "#00D4FF", gold: "#FACC15", dark: "#060A17", card: "#0B1226" },
                }
            }
        }
    </script>
    <!-- React & ReactDOM -->
    <script crossorigin src="https://unpkg.com/react@18/umd/react.development.js"></script>
    <script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.development.js"></script>
    <!-- Babel for JSX -->
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
    <!-- Lucide Icons -->
    <script src="https://unpkg.com/lucide@latest"></script>
    <style>
        body { background: #060A17; color: white; font-family: system-ui, -apple-system, sans-serif; }
        ::-webkit-scrollbar { width: 8px; height: 8px; }
        ::-webkit-scrollbar-thumb { background: #1e293b; border-radius: 8px; }
        .glass { background: rgba(11,18,38,0.8); backdrop-filter: blur(12px); }
        .gold-text { background: linear-gradient(90deg,#FACC15,#F59E0B); -webkit-background-clip: text; -webkit-text-fill-color: transparent; }
        .neon-text { color: #00D4FF; text-shadow: 0 0 20px rgba(0,212,255,.5); }
    </style>
</head>
<body class="bg-dark min-h-screen">
    <div id="root"></div>

    <script type="text/babel">
        const { useState, useEffect, useContext, createContext } = React;

        // --- UTILS ---
        const formatPKR = (n) => `Rs ${Number(n||0).toLocaleString()}`;
        const uid = (p) => `${p}_${Date.now().toString(36)}_${Math.random().toString(36).slice(2,7)}`;
        const genTicketId = () => `NZ-${Date.now().toString(36).toUpperCase()}-${Math.random().toString(36).slice(2,7).toUpperCase()}`;
        const genRefCode = () => `NZ-${Math.random().toString(36).slice(2,8).toUpperCase()}`;
        const ADMIN_ACCOUNT = "03137648720";

        // --- STORE CONTEXT ---
        const StoreContext = createContext(null);
        const useApp = () => useContext(StoreContext);

        const seedDB = () => ({
            users: [{ id:"u_demo", name:"Demo User", phone:"03001234567", password:"123456", balance:5000, totalSpent:1000, totalWinnings:0, referralCode:"NZ-DEMO01", referralsValid:4, hasBoughtFirst:true, freeCredits:0, createdAt:new Date().toISOString() }],
            draws: [
                { id:"d1", title:"iPhone 15 Pro Max Lucky Draw", prize:"iPhone 15 Pro Max 256GB", prizeValue:550000, ticketPrice:500, totalTickets:50, image:"https://images.unsplash.com/photo-1592750475338-74b7b21085ab?w=800", startTime:new Date().toISOString(), endTime:new Date(Date.now()+3*86400000).toISOString(), status:"active" },
                { id:"d2", title:"Honda CG 125 Mega Draw", prize:"Brand New Honda CG 125", prizeValue:250000, ticketPrice:1000, totalTickets:100, image:"https://images.unsplash.com/photo-1558981403-c5f9899a28bc?w=800", startTime:new Date().toISOString(), endTime:new Date(Date.now()+7*86400000).toISOString(), status:"active" },
                { id:"d3", title:"Rs 50,000 Cash Draw", prize:"Rs 50,000 Cash Prize", prizeValue:50000, ticketPrice:2000, totalTickets:10, image:"https://images.unsplash.com/photo-1580519542036-c47de6196ba5?w=800", startTime:new Date().toISOString(), endTime:new Date(Date.now()+1*86400000).toISOString(), status:"active" },
            ],
            tickets: [], deposits: [], withdraws: [], refClaims: [],
            winners: [
                { id:"w1", drawId:"OLD-101", drawTitle:"Samsung S24 Draw", prize:"Samsung S24 Ultra", winnerName:"Ahmed Raza", ticketId:"NZ-KX2P9A-QW12T", date:new Date(Date.now()-7*86400000).toISOString() },
            ],
            banners: [
                { id:"b1", type:"image", url:"https://images.unsplash.com/photo-1492684223066-81342ee5ff30?w=1200", title:"WIN iPhone 15 Pro Max", subtitle:"Only Rs 500 per ticket - 50 tickets only!" }
            ],
            proofs: [
                { id:"p1", type:"image", url:"https://images.unsplash.com/photo-1518895949257-7621c3c786d7?w=600", title:"Ahmed received iPhone" }
            ],
            currentUserId: null, isAdmin: false, currentRoute: "home"
        });

        function StoreProvider({children}) {
            const [db, setDb] = useState(seedDB());
            useEffect(() => {
                const saved = localStorage.getItem("naseebzone_single_v1");
                if(saved) try { setDb(JSON.parse(saved)); } catch(e){}
            }, []);
            useEffect(() => {
                localStorage.setItem("naseebzone_single_v1", JSON.stringify(db));
            }, [db]);

            const update = (fn) => setDb(p => fn({...p}));
            const me = db.users.find(u => u.id === db.currentUserId) || null;
            const soldCount = (drawId) => db.tickets.filter(t => t.drawId === drawId).length;

            const actions = {
                me, db, soldCount,
                navigate: (route) => update(d => ({...d, currentRoute: route})),
                register: (name, phone, pass, ref) => {
                    if(db.users.find(u => u.phone === phone)) return "Phone already registered";
                    const referrer = db.users.find(u => u.referralCode === ref);
                    const nu = { id: uid("u"), name, phone, password: pass, balance: 0, totalSpent: 0, totalWinnings: 0, referralCode: genRefCode(), referredBy: referrer?.id, referralsValid: 0, hasBoughtFirst: false, freeCredits: 0, createdAt: new Date().toISOString() };
                    update(d => ({...d, users: [...d.users, nu], currentUserId: nu.id })); return "ok";
                },
                login: (phone, pass) => {
                    const u = db.users.find(x => x.phone === phone && x.password === pass);
                    if(!u) return "Invalid credentials";
                    update(d => ({...d, currentUserId: u.id })); return "ok";
                },
                logout: () => update(d => ({...d, currentUserId: null})),
                adminLogin: (e, p) => { if(e==="admin@naseebzone.com" && p==="admin123"){ update(d => ({...d, isAdmin: true})); return "ok"; } return "Wrong admin credentials"; },
                adminLogout: () => update(d => ({...d, isAdmin: false})),
                buyTicket: (drawId) => {
                    if(!me) return "Login required";
                    const draw = db.draws.find(d => d.id === drawId); if(!draw || draw.status !== "active") return "Draw not active";
                    if(soldCount(drawId) >= draw.totalTickets) return "Sold out";
                    if(me.balance < draw.ticketPrice) return "Insufficient balance. Please deposit.";
                    const tid = genTicketId();
                    const t = { id: tid, drawId, userId: me.id, userName: me.name, date: new Date().toISOString(), status: "active", isFree: false };
                    update(d => {
                        let users = d.users.map(u => u.id === me.id ? {...u, balance: u.balance - draw.ticketPrice, totalSpent: u.totalSpent + draw.ticketPrice, hasBoughtFirst: true} : u);
                        const buyer = d.users.find(u => u.id === me.id);
                        if(buyer && !buyer.hasBoughtFirst && buyer.referredBy){
                            users = users.map(u => u.id === buyer.referredBy ? {...u, referralsValid: u.referralsValid + 1} : u);
                        }
                        return {...d, users, tickets: [...d.tickets, t]};
                    });
                    return `Ticket Purchased! ID: ${tid}`;
                },
                createDeposit: (amount, method, trxId, screenshot) => {
                    if(!me) return "Login required";
                    update(d => ({...d, deposits: [...d.deposits, { id: uid("dep"), userId: me.id, userName: me.name, amount, method, trxId, screenshot, status: "pending", date: new Date().toISOString() }] }));
                    return "ok";
                },
                approveDeposit: (id) => update(d => {
                    const dep = d.deposits.find(x => x.id === id); if(!dep || dep.status !== "pending") return d;
                    return {...d, deposits: d.deposits.map(x => x.id === id ? {...x, status: "approved"} : x), users: d.users.map(u => u.id === dep.userId ? {...u, balance: u.balance + dep.amount} : u)};
                }),
                rejectDeposit: (id) => update(d => ({...d, deposits: d.deposits.map(x => x.id === id ? {...x, status: "rejected"} : x)})),
                createWithdraw: (amount, method, account) => {
                    if(!me) return "Login required";
                    if(amount > me.balance) return "Insufficient balance";
                    update(d => ({...d, withdraws: [...d.withdraws, { id: uid("wd"), userId: me.id, userName: me.name, amount, method, account, status: "pending", date: new Date().toISOString() }], users: d.users.map(u => u.id === me.id ? {...u, balance: u.balance - amount} : u)}));
                    return "ok";
                },
                approveWithdraw: (id) => update(d => ({...d, withdraws: d.withdraws.map(x => x.id === id ? {...x, status: "approved"} : x)})),
                rejectWithdraw: (id) => update(d => {
                    const w = d.withdraws.find(x => x.id === id); if(!w) return d;
                    return {...d, withdraws: d.withdraws.map(x => x.id === id ? {...x, status: "rejected"} : x), users: d.users.map(u => u.id === w.userId ? {...u, balance: u.balance + w.amount} : u)};
                }),
                createDraw: (v) => update(d => ({...d, draws: [...d.draws, { id: uid("d"), ...v, status: new Date(v.startTime) > new Date() ? "upcoming" : "active" }]})),
                pickWinner: (drawId, ticketId) => update(d => {
                    const draw = d.draws.find(x => x.id === drawId); const tic = d.tickets.find(x => x.id === ticketId); if(!draw || !tic) return d;
                    return {...d,
                        draws: d.draws.map(x => x.id === drawId ? {...x, status: "completed", winnerTicketId: ticketId, winnerUserId: tic.userId} : x),
                        tickets: d.tickets.map(t => t.drawId === drawId ? (t.id === ticketId ? {...t, status: "won"} : {...t, status: "lost"}) : t),
                        users: d.users.map(u => u.id === tic.userId ? {...u, balance: u.balance + draw.prizeValue, totalWinnings: u.totalWinnings + draw.prizeValue} : u),
                        winners: [...d.winners, { id: uid("w"), drawId: draw.id, drawTitle: draw.title, prize: draw.prize, winnerName: tic.userName, ticketId, date: new Date().toISOString() }]
                    };
                }),
                autoWinner: (drawId) => {
                    const parts = db.tickets.filter(t => t.drawId === drawId); if(!parts.length) return "No participants";
                    const win = parts[Math.floor(Math.random() * parts.length)];
                    actions.pickWinner(drawId, win.id); return `Winner: ${win.userName} (${win.id})`;
                },
                claimFree: (drawId) => {
                    if(!me) return "Login required";
                    if(me.referralsValid < 10) return "Need 10 valid referrals";
                    if(db.refClaims.find(c => c.userId === me.id && c.status === "pending")) return "Already pending";
                    update(d => ({...d, refClaims: [...d.refClaims, { id: uid("rc"), userId: me.id, userName: me.name, drawId, count: me.referralsValid, status: "pending", date: new Date().toISOString() }]}));
                    return "ok";
                },
                approveClaim: (id) => update(d => {
                    const c = d.refClaims.find(x => x.id === id); if(!c) return d;
                    const t = { id: genTicketId(), drawId: c.drawId, userId: c.userId, userName: c.userName, date: new Date().toISOString(), status: "active", isFree: true };
                    return {...d, refClaims: d.refClaims.map(x => x.id === id ? {...x, status: "approved"} : x), tickets: [...d.tickets, t]};
                }),
                rejectClaim: (id) => update(d => ({...d, refClaims: d.refClaims.map(x => x.id === id ? {...x, status: "rejected"} : x)})),
                addMedia: (kind, m) => update(d => ({...d, [kind]: [...d[kind], m]})),
                delMedia: (kind, id) => update(d => ({...d, [kind]: d[kind].filter(x => x.id !== id)})),
            };

            return <StoreContext.Provider value={actions}>{children}</StoreContext.Provider>;
        }

        // --- COMPONENTS ---
        function Navbar() {
            const { me, navigate, db } = useApp();
            const route = db.currentRoute;
            const links = [["home","Home"],["draws","Draws"],["winners","Winners"],["account","Account"],["contact","Contact"],["admin","Admin Panel"]];

            return (
                <header className="sticky top-0 z-50 glass border-b border-white/10">
                    <div className="max-w-7xl mx-auto px-4 h-16 flex items-center justify-between">
                        <div onClick={()=>navigate("home")} className="flex items-center gap-2 text-2xl font-black cursor-pointer">
                            <i data-lucide="sparkles" className="text-gold"></i>
                            <span>Naseeb<span className="neon-text">Zone</span></span>
                        </div>
                        <nav className="hidden md:flex gap-6">
                            {links.map(([h,l]) => <button key={h} onClick={()=>navigate(h)} className={`hover:text-neon ${route===h?"text-neon font-bold":"text-gray-300"}`}>{l}</button>)}
                        </nav>
                        <div className="hidden md:flex items-center gap-3">
                            {me ? <div className="flex items-center gap-2 bg-white/5 border border-gold/30 px-3 py-1.5 rounded-full text-sm"><i data-lucide="wallet" className="text-gold w-4 h-4"></i>{formatPKR(me.balance)}</div>
                            : <button onClick={()=>navigate("account")} className="bg-neon text-black font-bold px-4 py-2 rounded-lg text-sm">Login</button>}
                        </div>
                    </div>
                </header>
            );
        }

        function Footer() {
            return (
                <footer className="border-t border-white/10 bg-black/40 mt-12">
                    <div className="max-w-7xl mx-auto px-4 py-10 grid md:grid-cols-3 gap-8">
                        <div><h3 className="text-xl font-black">Naseeb<span className="text-neon">Zone</span></h3><p className="text-gray-400 text-sm mt-2">Pakistan's most transparent lucky draw platform. Verifiable tickets, live draws, instant payouts.</p></div>
                        <div><h4 className="font-bold text-gold mb-3">Quick Support</h4><p className="text-sm text-gray-300">Easypaisa / JazzCash: 03137648720<br/>Email: support@naseebzone.com</p></div>
                        <div><h4 className="font-bold text-gold mb-3">Timing</h4><p className="text-sm text-gray-300">9AM - 11PM PKT Daily<br/>Play Responsibly. 18+ Only.</p></div>
                    </div>
                    <div className="text-center text-xs text-gray-500 pb-6">© 2026 NaseebZone. All rights reserved.</div>
                </footer>
            );
        }

        // --- PUBLIC PAGES ---
        function HomePage() {
            const { db, navigate, soldCount } = useApp();
            const active = db.draws.filter(d => d.status === "active").slice(0,3);

            return (
                <div className="max-w-7xl mx-auto px-4 space-y-12 py-6">
                    <div className="bg-gradient-to-r from-card to-blue-950 border border-white/10 p-8 md:p-14 rounded-2xl">
                        <h1 className="text-3xl md:text-5xl font-black leading-tight">WIN Big with <span className="gold-text">NaseebZone</span></h1>
                        <p className="mt-3 text-gray-300 max-w-xl">Pakistan's #1 Fair & Transparent Lucky Draw Platform. Buy tickets securely via Easypaisa or JazzCash.</p>
                        <button onClick={()=>navigate("draws")} className="mt-6 bg-gold text-black font-bold px-6 py-3 rounded-xl shadow-lg">Explore Active Draws</button>
                    </div>

                    <div>
                        <div className="flex justify-between items-center mb-4"><h2 className="text-2xl font-black">🔥 Active <span className="gold-text">Draws</span></h2><button onClick={()=>navigate("draws")} className="text-neon text-sm">View All →</button></div>
                        <div className="grid md:grid-cols-3 gap-6">
                            {active.map(d => {
                                const sold = soldCount(d.id);
                                const pct = Math.round(sold/d.totalTickets*100);
                                return (
                                    <div key={d.id} className="bg-card border border-white/10 rounded-2xl overflow-hidden">
                                        <img src={d.image} className="h-48 w-full object-cover"/>
                                        <div className="p-5 space-y-3">
                                            <h3 className="font-bold text-lg">{d.title}</h3>
                                            <p className="text-gold text-sm font-semibold">🎁 {d.prize}</p>
                                            <div><div className="flex justify-between text-xs text-gray-400 mb-1"><span>{sold}/{d.totalTickets} Sold</span><span>{pct}%</span></div>
                                            <div className="h-2 bg-white/10 rounded-full"><div className="h-full bg-neon rounded-full" style={{width:`${pct}%`}}></div></div></div>
                                            <div className="flex justify-between items-center pt-2"><span className="font-black text-xl">{formatPKR(d.ticketPrice)}</span><button onClick={()=>navigate("draws")} className="bg-neon text-black font-bold px-4 py-2 rounded-lg text-sm">Buy Ticket</button></div>
                                        </div>
                                    </div>
                                );
                            })}
                        </div>
                    </div>
                </div>
            );
        }

        function DrawsPage() {
            const { db, me, buyTicket, soldCount } = useApp();
            const [msg, setMsg] = useState("");
            return (
                <div className="max-w-7xl mx-auto px-4 py-8">
                    <h1 className="text-3xl font-black">All <span className="gold-text">Lucky Draws</span></h1>
                    {msg && <div className="bg-green-500/10 border border-green-500/30 p-3 rounded-xl my-4 text-green-300 text-sm">{msg}</div>}
                    {!me && <div className="bg-gold/10 border border-gold/30 p-3 rounded-xl my-4 text-sm">Please login in the Account tab to buy tickets.</div>}
                    <div className="grid md:grid-cols-2 gap-6 mt-6">
                        {db.draws.map(d => {
                            const sold = soldCount(d.id);
                            return (
                                <div key={d.id} className="bg-card border border-white/10 rounded-2xl overflow-hidden flex flex-col md:flex-row">
                                    <img src={d.image} className="md:w-56 h-48 md:h-auto object-cover"/>
                                    <div className="p-5 flex-1 space-y-2">
                                        <h3 className="font-bold text-lg">{d.title}</h3>
                                        <p className="text-gold text-sm">🎁 {d.prize}</p>
                                        <div className="text-xs text-gray-400">{sold}/{d.totalTickets} Sold</div>
                                        <div className="flex justify-between items-center pt-4"><span className="font-black">{formatPKR(d.ticketPrice)}</span>
                                        <button disabled={d.status!=="active"} onClick={()=>setMsg(buyTicket(d.id))} className="bg-gold text-black font-bold px-5 py-2 rounded-lg text-sm disabled:opacity-40">Buy Ticket</button></div>
                                    </div>
                                </div>
                            );
                        })}
                    </div>
                </div>
            );
        }

        function WinnersPage() {
            const { db } = useApp();
            return (
                <div className="max-w-6xl mx-auto px-4 py-8">
                    <h1 className="text-3xl font-black">Transparent <span className="neon-text">Winners Ledger</span></h1>
                    <div className="mt-6 bg-card border border-white/10 rounded-2xl overflow-x-auto">
                        <table className="w-full text-sm min-w-[700px]">
                            <thead><tr className="text-left text-gray-400 border-b border-white/10"><th className="p-4">Draw ID</th><th>Draw Title</th><th>Prize</th><th>Winner</th><th>Winning Ticket</th></tr></thead>
                            <tbody>
                                {db.winners.map(w => (
                                    <tr key={w.id} className="border-b border-white/5">
                                        <td className="p-4 font-mono text-neon">{w.drawId}</td>
                                        <td>{w.drawTitle}</td>
                                        <td className="text-gold">{w.prize}</td>
                                        <td>{w.winnerName}</td>
                                        <td className="font-mono text-xs">{w.ticketId}</td>
                                    </tr>
                                ))}
                            </tbody>
                        </table>
                    </div>
                </div>
            );
        }

        function AccountPage() {
            const app = useApp();
            const { me, db } = app;
            const [mode, setMode] = useState("login");
            const [phone, setPhone] = useState("");
            const [pass, setPass] = useState("");
            const [name, setName] = useState("");
            const [ref, setRef] = useState("");
            const [err, setErr] = useState("");
            const [dep, setDep] = useState({amount:"", method:"Easypaisa", trx:"", img:"https://images.unsplash.com/photo-1554224155-8d04cb21cd6c?w=400"});
            const [wd, setWd] = useState({amount:"", method:"Easypaisa", account:""});
            const [tab, setTab] = useState("overview");

            if(!me) return (
                <div className="max-w-md mx-auto px-4 py-12">
                    <div className="bg-card border border-white/10 rounded-2xl p-6">
                        <h1 className="text-2xl font-black text-center">Naseeb<span className="text-neon">Zone</span></h1>
                        <div className="flex bg-white/5 rounded-lg p-1 mt-4">
                            <button onClick={()=>setMode("login")} className={`flex-1 py-2 rounded-md text-sm font-bold ${mode==="login"?"bg-neon text-black":""}`}>Login</button>
                            <button onClick={()=>setMode("register")} className={`flex-1 py-2 rounded-md text-sm font-bold ${mode==="register"?"bg-neon text-black":""}`}>Register</button>
                        </div>
                        {err && <p className="text-red-400 text-sm mt-3">{err}</p>}
                        <div className="space-y-3 mt-4">
                            {mode==="register" && <>
                                <input placeholder="Full Name" value={name} onChange={e=>setName(e.target.value)} className="w-full bg-black/40 border border-white/10 rounded-lg px-4 py-2.5 text-sm"/>
                                <input placeholder="Referral Code (optional)" value={ref} onChange={e=>setRef(e.target.value)} className="w-full bg-black/40 border border-white/10 rounded-lg px-4 py-2.5 text-sm"/>
                            </>}
                            <input placeholder="Phone e.g 03001234567" value={phone} onChange={e=>setPhone(e.target.value)} className="w-full bg-black/40 border border-white/10 rounded-lg px-4 py-2.5 text-sm"/>
                            <input type="password" placeholder="Password" value={pass} onChange={e=>setPass(e.target.value)} className="w-full bg-black/40 border border-white/10 rounded-lg px-4 py-2.5 text-sm"/>
                            <button onClick={()=>{ const r = mode==="login" ? app.login(phone, pass) : app.register(name, phone, pass, ref); if(r!=="ok") setErr(r); }} className="w-full bg-gold text-black font-bold py-2.5 rounded-lg text-sm">{mode==="login"?"Login":"Create Account"}</button>
                            <p className="text-xs text-gray-500 text-center">Demo User: 03001234567 / 123456</p>
                        </div>
                    </div>
                </div>
            );

            return (
                <div className="max-w-5xl mx-auto px-4 py-8">
                    <div className="flex justify-between items-center"><h1 className="text-2xl font-black">My <span className="gold-text">Account</span></h1><button onClick={app.logout} className="text-sm text-red-400 border border-red-400/30 px-4 py-1.5 rounded-lg">Logout</button></div>
                    <div className="grid grid-cols-3 gap-3 mt-4">
                        <div className="bg-card border border-gold/30 rounded-xl p-4"><p className="text-xs text-gray-400">Balance</p><p className="font-black text-xl text-gold">{formatPKR(me.balance)}</p></div>
                        <div className="bg-card border border-white/10 rounded-xl p-4"><p className="text-xs text-gray-400">Total Spent</p><p className="font-black text-xl">{formatPKR(me.totalSpent)}</p></div>
                        <div className="bg-card border border-white/10 rounded-xl p-4"><p className="text-xs text-gray-400">Winnings</p><p className="font-black text-xl text-green-400">{formatPKR(me.totalWinnings)}</p></div>
                    </div>
                    <div className="flex gap-2 mt-6">{["overview","deposit","withdraw","tickets"].map(t=><button key={t} onClick={()=>setTab(t)} className={`px-4 py-2 rounded-lg text-sm font-bold capitalize ${tab===t?"bg-neon text-black":"bg-white/10"}`}>{t}</button>)}</div>

                    {tab==="overview" && <div className="bg-card border border-white/10 rounded-xl p-5 mt-4"><h3 className="font-bold text-gold">Deposit Instructions</h3><p className="text-sm mt-2">Send funds to Easypaisa/JazzCash: <b>{ADMIN_ACCOUNT}</b> and submit deposit proof.</p></div>}
                    
                    {tab==="deposit" && <div className="bg-card border border-white/10 rounded-xl p-5 mt-4 max-w-xl space-y-3">
                        <h3 className="font-bold">Deposit Funds</h3>
                        <input type="number" placeholder="Amount (Rs)" value={dep.amount} onChange={e=>setDep({...dep, amount:e.target.value})} className="w-full bg-black/40 border border-white/10 rounded-lg px-4 py-2.5 text-sm"/>
                        <select value={dep.method} onChange={e=>setDep({...dep, method:e.target.value})} className="w-full bg-black/40 border border-white/10 rounded-lg px-4 py-2.5 text-sm"><option>Easypaisa</option><option>JazzCash</option></select>
                        <input placeholder="Transaction ID (TRX ID)" value={dep.trx} onChange={e=>setDep({...dep, trx:e.target.value})} className="w-full bg-black/40 border border-white/10 rounded-lg px-4 py-2.5 text-sm"/>
                        <button onClick={()=>{ if(!dep.amount||!dep.trx) return alert("Fill all fields"); app.createDeposit(Number(dep.amount), dep.method, dep.trx, dep.img); alert("Deposit submitted!"); setDep({amount:"", method:"Easypaisa", trx:"", img:""}); }} className="w-full bg-green-500 text-black font-bold py-2.5 rounded-lg text-sm">Submit Deposit</button>
                    </div>}

                    {tab==="withdraw" && <div className="bg-card border border-white/10 rounded-xl p-5 mt-4 max-w-xl space-y-3">
                        <h3 className="font-bold">Request Withdrawal</h3>
                        <input type="number" placeholder="Amount" value={wd.amount} onChange={e=>setWd({...wd, amount:e.target.value})} className="w-full bg-black/40 border border-white/10 rounded-lg px-4 py-2.5 text-sm"/>
                        <select value={wd.method} onChange={e=>setWd({...wd, method:e.target.value})} className="w-full bg-black/40 border border-white/10 rounded-lg px-4 py-2.5 text-sm"><option>Easypaisa</option><option>JazzCash</option></select>
                        <input placeholder="Account Number" value={wd.account} onChange={e=>setWd({...wd, account:e.target.value})} className="w-full bg-black/40 border border-white/10 rounded-lg px-4 py-2.5 text-sm"/>
                        <button onClick={()=>{ const r=app.createWithdraw(Number(wd.amount), wd.method, wd.account); alert(r==="ok"?"Withdrawal requested!":r); }} className="w-full bg-gold text-black font-bold py-2.5 rounded-lg text-sm">Request Withdrawal</button>
                    </div>}

                    {tab==="tickets" && <div className="bg-card border border-white/10 rounded-xl p-5 mt-4">
                        <h3 className="font-bold mb-3">My Tickets</h3>
                        {db.tickets.filter(t=>t.userId===me.id).map(t=><div key={t.id} className="flex justify-between text-sm py-2 border-b border-white/5"><span className="font-mono text-neon">{t.id}</span><span>{t.status}</span></div>)}
                    </div>}
                </div>
            );
        }

        function ContactPage() {
            return (
                <div className="max-w-4xl mx-auto px-4 py-8">
                    <h1 className="text-3xl font-black">Contact <span className="gold-text">Support</span></h1>
                    <div className="bg-card border border-white/10 rounded-2xl p-6 mt-6 space-y-3">
                        <p className="text-sm">Easypaisa / JazzCash: <b>03137648720</b></p>
                        <p className="text-sm">Email: <b>support@naseebzone.com</b></p>
                        <p className="text-sm">Timing: <b>9AM - 11PM PKT</b></p>
                    </div>
                </div>
            );
        }

        // --- SECURE ADMIN PANEL ---
        function AdminPanel() {
            const app = useApp();
            const { db } = app;
            const [e, setE] = useState("");
            const [p, setP] = useState("");
            const [err, setErr] = useState("");
            const [tab, setTab] = useState("finances");
            const [drawForm, setDrawForm] = useState({title:"", prize:"", prizeValue:50000, ticketPrice:500, totalTickets:50, image:"https://images.unsplash.com/photo-1592750475338-74b7b21085ab?w=800", endTime:new Date(Date.now()+86400000).toISOString().slice(0,16)});
            const [selWinner, setSelWinner] = useState({});

            if(!db.isAdmin) return (
                <div className="max-w-md mx-auto px-4 py-24">
                    <div className="bg-card border border-white/10 rounded-2xl p-8">
                        <h1 className="text-2xl font-black text-center">🔒 Admin Login</h1>
                        {err && <p className="text-red-400 text-sm mt-2">{err}</p>}
                        <input placeholder="admin@naseebzone.com" value={e} onChange={x=>setE(x.target.value)} className="w-full mt-4 bg-black/40 border border-white/10 rounded-lg px-4 py-2.5 text-sm"/>
                        <input type="password" placeholder="Password" value={p} onChange={x=>setP(x.target.value)} className="w-full mt-3 bg-black/40 border border-white/10 rounded-lg px-4 py-2.5 text-sm"/>
                        <button onClick={()=>{ const r=app.adminLogin(e,p); if(r!=="ok") setErr(r); }} className="w-full mt-4 bg-neon text-black font-bold py-2.5 rounded-lg text-sm">Secure Login</button>
                        <p className="text-xs text-gray-500 text-center mt-3">admin@naseebzone.com / admin123</p>
                    </div>
                </div>
            );

            return (
                <div className="max-w-6xl mx-auto px-4 py-8">
                    <div className="flex justify-between items-center"><h1 className="text-2xl font-black">NaseebZone <span className="text-gold">ADMIN PANEL</span></h1><button onClick={app.adminLogout} className="bg-red-500/20 text-red-300 px-4 py-1.5 rounded-lg text-sm">Logout Admin</button></div>
                    <div className="flex gap-2 mt-4 overflow-x-auto">{["finances","draws","active","players"].map(t=><button key={t} onClick={()=>setTab(t)} className={`px-4 py-2 rounded-lg text-sm font-bold capitalize whitespace-nowrap ${tab===t?"bg-neon text-black":"bg-white/10"}`}>{t}</button>)}</div>

                    {tab==="finances" && <div className="space-y-6 mt-6">
                        <div className="bg-card border border-white/10 rounded-xl p-5">
                            <h3 className="font-bold mb-3">Pending Deposits</h3>
                            {db.deposits.filter(d=>d.status==="pending").map(d=>(
                                <div key={d.id} className="flex justify-between items-center bg-black/40 p-3 rounded-lg text-sm mb-2">
                                    <span><b>{d.userName}</b> • {formatPKR(d.amount)} • TRX: <span className="font-mono text-neon">{d.trxId}</span></span>
                                    <div className="flex gap-2"><button onClick={()=>app.approveDeposit(d.id)} className="bg-green-500 text-black px-3 py-1 rounded font-bold">Approve</button><button onClick={()=>app.rejectDeposit(d.id)} className="bg-red-500 text-white px-3 py-1 rounded">Reject</button></div>
                                </div>
                            ))}
                            {!db.deposits.filter(d=>d.status==="pending").length && <p className="text-gray-500 text-sm">No pending deposits.</p>}
                        </div>
                        <div className="bg-card border border-white/10 rounded-xl p-5">
                            <h3 className="font-bold mb-3">Pending Withdrawals</h3>
                            {db.withdraws.filter(w=>w.status==="pending").map(w=>(
                                <div key={w.id} className="flex justify-between items-center bg-black/40 p-3 rounded-lg text-sm mb-2">
                                    <span><b>{w.userName}</b> • {formatPKR(w.amount)} • {w.method} ({w.account})</span>
                                    <div className="flex gap-2"><button onClick={()=>app.approveWithdraw(w.id)} className="bg-green-500 text-black px-3 py-1 rounded font-bold">Pay</button><button onClick={()=>app.rejectWithdraw(w.id)} className="bg-red-500 text-white px-3 py-1 rounded">Reject</button></div>
                                </div>
                            ))}
                            {!db.withdraws.filter(w=>w.status==="pending").length && <p className="text-gray-500 text-sm">No pending withdrawals.</p>}
                        </div>
                    </div>}

                    {tab==="draws" && <div className="bg-card border border-white/10 rounded-xl p-6 mt-6 max-w-xl space-y-3">
                        <h3 className="font-bold text-lg">Create New Draw</h3>
                        <input placeholder="Title" value={drawForm.title} onChange={e=>setDrawForm({...drawForm, title:e.target.value})} className="w-full bg-black/40 border border-white/10 rounded-lg px-4 py-2.5 text-sm"/>
                        <input placeholder="Prize Description" value={drawForm.prize} onChange={e=>setDrawForm({...drawForm, prize:e.target.value})} className="w-full bg-black/40 border border-white/10 rounded-lg px-4 py-2.5 text-sm"/>
                        <div className="grid grid-cols-2 gap-3">
                            <input type="number" placeholder="Prize Value" value={drawForm.prizeValue} onChange={e=>setDrawForm({...drawForm, prizeValue:Number(e.target.value)})} className="bg-black/40 border border-white/10 rounded-lg px-4 py-2.5 text-sm"/>
                            <input type="number" placeholder="Ticket Price" value={drawForm.ticketPrice} onChange={e=>setDrawForm({...drawForm, ticketPrice:Number(e.target.value)})} className="bg-black/40 border border-white/10 rounded-lg px-4 py-2.5 text-sm"/>
                        </div>
                        <input placeholder="Image URL" value={drawForm.image} onChange={e=>setDrawForm({...drawForm, image:e.target.value})} className="w-full bg-black/40 border border-white/10 rounded-lg px-4 py-2.5 text-sm"/>
                        <button onClick={()=>{ if(!drawForm.title) return alert("Enter title"); app.createDraw({...drawForm, startTime:new Date().toISOString(), endTime:new Date(drawForm.endTime).toISOString()}); alert("Draw created successfully!"); }} className="w-full bg-gold text-black font-bold py-2.5 rounded-lg text-sm">Launch Draw</button>
                    </div>}

                    {tab==="active" && <div className="space-y-4 mt-6">
                        {db.draws.filter(d=>d.status==="active").map(d=>{
                            const parts = db.tickets.filter(t=>t.drawId===d.id);
                            return (
                                <div key={d.id} className="bg-card border border-white/10 rounded-xl p-5">
                                    <h3 className="font-bold">{d.title} ({parts.length} tickets sold)</h3>
                                    <div className="flex gap-2 mt-3">
                                        <select value={selWinner[d.id]||""} onChange={e=>setSelWinner({...selWinner, [d.id]: e.target.value})} className="flex-1 bg-black/40 border border-white/10 rounded-lg px-3 py-2 text-xs">
                                            <option value="">Select ticket to win</option>
                                            {parts.map(p=><option key={p.id} value={p.id}>{p.id} - {p.userName}</option>)}
                                        </select>
                                        <button onClick={()=>{ if(!selWinner[d.id]) return alert("Select ticket"); app.pickWinner(d.id, selWinner[d.id]); alert("Winner locked!"); }} className="bg-gold text-black font-bold px-4 py-2 rounded-lg text-xs">Lock Winner</button>
                                        <button onClick={()=>alert(app.autoWinner(d.id))} className="bg-neon text-black font-bold px-4 py-2 rounded-lg text-xs">Auto Pick</button>
                                    </div>
                                </div>
                            );
                        })}
                    </div>}

                    {tab==="players" && <div className="bg-card border border-white/10 rounded-xl p-5 mt-6 overflow-x-auto">
                        <table className="w-full text-sm">
                            <thead><tr className="text-left text-gray-400 border-b border-white/10"><th className="p-3">Name</th><th>Phone</th><th>Balance</th></tr></thead>
                            <tbody>{db.users.map(u=><tr key={u.id} className="border-b border-white/5"><td className="p-3">{u.name}</td><td>{u.phone}</td><td className="text-gold">{formatPKR(u.balance)}</td></tr>)}</tbody>
                        </table>
                    </div>}
                </div>
            );
        }

        // --- MAIN APP ROUTER CONTAINER ---
        function App() {
            const { db } = useApp();
            const route = db.currentRoute;

            return (
                <div className="min-h-screen flex flex-col justify-between">
                    <Navbar />
                    <div className="flex-1">
                        {route === "home" && <HomePage />}
                        {route === "draws" && <DrawsPage />}
                        {route === "winners" && <WinnersPage />}
                        {route === "account" && <AccountPage />}
                        {route === "contact" && <ContactPage />}
                        {route === "admin" && <AdminPanel />}
                    </div>
                    <Footer />
                </div>
            );
        }

        ReactDOM.render(<StoreProvider><App /></StoreProvider>, document.getElementById('root'));
        setTimeout(() => lucide.createIcons(), 100);
    </script>
</body>
</html>
