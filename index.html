            headers: { "X-Master-Key": JSONBIN_KEY, "X-Bin-Meta": "false" }
          });
          if (res.ok) {
            const data = await res.json();
            if (data) {
              const remoteUsers = data.users || (data.record ? data.record.users : []) || [];
              const remoteDeps = data.deposits || (data.record ? data.record.deposits : []) || [];
              const remoteWds = data.withdrawals || (data.record ? data.record.withdrawals : []) || [];

              const userMap = new Map();
              remoteUsers.forEach(u => { if (u && u.identifier) userMap.set(u.identifier.toLowerCase(), { ...u }); });
              localUsers.forEach(u => {
                if (!u || !u.identifier) return;
                const k = u.identifier.toLowerCase();
                const remote = userMap.get(k);
                if (remote) {
                  const localTime = Number(u.lastUpdatedAt) || 0;
                  const remoteTime = Number(remote.lastUpdatedAt) || 0;
                  let chosen = (localTime >= remoteTime) ? { ...remote, ...u } : { ...u, ...remote };

                  const combinedPlans = [...(remote.activePlans || []), ...(u.activePlans || [])];
                  const uniquePlansMap = new Map();
                  combinedPlans.forEach(p => { if (p && p.planId) uniquePlansMap.set(String(p.planId), p); });
                  const finalPlans = Array.from(uniquePlansMap.values());

                  const finalPlanLimit = finalPlans.length > 0
                    ? finalPlans.reduce((sum, p) => sum + (p.dailyAds || 0), 0)
                    : Math.max(Number(u.planDailyAdLimit) || 0, Number(remote.planDailyAdLimit) || 0, 5);

                  const finalPlanName = finalPlans.length > 0
                    ? finalPlans.map(p => p.name).join(" + ")
                    : (chosen.activePlanName || "FREE Starter Plan");

                  userMap.set(k, {
                    ...chosen,
                    activePlans: finalPlans,
                    planDailyAdLimit: finalPlanLimit,
                    activePlanName: finalPlanName
                  });
                } else {
                  userMap.set(k, { ...u });
                }
              });
              localUsers = Array.from(userMap.values());

              const depMap = new Map();
              remoteDeps.forEach(d => { if (d && d.id) depMap.set(String(d.id), { ...d }); });
              localDeps.forEach(d => {
                if (!d || !d.id) return;
                const key = String(d.id);
                const remote = depMap.get(key);
                if (remote) {
                  let resolvedStatus = d.status || remote.status || "PENDING";
                  if (d.status === "APPROVED" || remote.status === "APPROVED") resolvedStatus = "APPROVED";
                  else if (d.status === "REJECTED" || remote.status === "REJECTED") resolvedStatus = "REJECTED";
                  depMap.set(key, { ...remote, ...d, status: resolvedStatus });
                } else {
                  depMap.set(key, { ...d });
                }
              });
              localDeps = Array.from(depMap.values());

              const wdMap = new Map();
              remoteWds.forEach(w => { if (w && w.id) wdMap.set(String(w.id), { ...w }); });
              localWds.forEach(w => {
                if (!w || !w.id) return;
                const key = String(w.id);
                const remote = wdMap.get(key);
                if (remote) {
                  let resolvedStatus = w.status || remote.status || "PENDING";
                  if (w.status === "COMPLETED" || remote.status === "COMPLETED") resolvedStatus = "COMPLETED";
                  else if (w.status === "REJECTED" || remote.status === "REJECTED") resolvedStatus = "REJECTED";
                  wdMap.set(key, { ...remote, ...w, status: resolvedStatus });
                } else {
                  wdMap.set(key, { ...w });
                }
              });
              localWds = Array.from(wdMap.values());

              hasChanges = true;
            }
          }
        } catch (e) {
          console.warn("JSONBin cloud read error:", e);
        }

        if (hasChanges) {
          saveUsers(localUsers);
          saveDeposits(localDeps);
          saveWithdrawals(localWds);
        }

          renderAdminScreen();
        } else if (currentScreen !== "auth") {
          refreshCurrentScreen(currentScreen);
        }
      } catch (err) {
        console.warn("Cloud sync offline fallback:", err);
      } finally {
        isSyncingCloud = false;
        if (syncIcon) syncIcon.classList.remove("fa-spin");
      }
    }

    // UI Helpers & Navigation
    function showToast(message, type = "info") {
      const toast = document.getElementById("toast");
      const msgEl = document.getElementById("toast-message");
      const iconEl = document.getElementById("toast-icon");
      if (!toast || !msgEl || !iconEl) return;
      
      msgEl.textContent = message;
      if (type === "success") {
        iconEl.innerHTML = '<i class="fa-solid fa-circle-check text-emerald-400"></i>';
      } else if (type === "error") {
        iconEl.innerHTML = '<i class="fa-solid fa-circle-exclamation text-rose-400"></i>';
      } else {
        iconEl.innerHTML = '<i class="fa-solid fa-circle-info text-amber-400"></i>';
      }
      
      toast.classList.remove("opacity-0", "pointer-events-none", "-translate-y-2");
      toast.classList.add("opacity-100", "translate-y-0");
      
      setTimeout(() => {
        toast.classList.remove("opacity-100", "translate-y-0");
        toast.classList.add("opacity-0", "pointer-events-none", "-translate-y-2");
      }, 3000);
    }

      currentScreen = screen;
      const user = getCurrentUser();
      const navBar = document.getElementById("bottom-navigation-bar");
      const adminBtn = document.getElementById("admin-indicator-btn");
      const logoutBtn = document.getElementById("header-logout-btn");

      if (!user) {
        navBar.classList.add("hidden");
        adminBtn.classList.add("hidden");
        logoutBtn.classList.add("hidden");
        renderAuthScreen();
        return;
      }

      navBar.classList.remove("hidden");
      logoutBtn.classList.remove("hidden");

      if (user.isAdmin || user.identifier.toLowerCase() === ADMIN_EMAIL.toLowerCase()) {
        adminBtn.classList.remove("hidden");
      } else {
        adminBtn.classList.add("hidden");
      }

      // Update Nav active classes
      ["dashboard", "watch", "plans", "deposit", "withdraw"].forEach(key => {
        const el = document.getElementById(`nav-${key}`);
        if (el) {
          if (screen === key) {
            el.className = "flex-1 flex flex-col items-center gap-1 py-1 text-amber-400 font-bold transition";
          } else {
            el.className = "flex-1 flex flex-col items-center gap-1 py-1 text-slate-400 hover:text-amber-400 transition";
          }
        }
      });

      if (screen === "dashboard") renderDashboardScreen();
      else if (screen === "watch") renderWatchScreen();
      else if (screen === "plans") renderPlansScreen();
      else if (screen === "deposit") renderDepositScreen();
      else if (screen === "withdraw") renderWithdrawScreen();
      else if (screen === "admin") renderAdminScreen();

    function startWatchingAd() {
      const user = getCurrentUser();
      if (!user) return;
      const totalAds = user.planDailyAdLimit || 5;
      if (user.adsWatchedToday >= totalAds) {
        showToast("Daily ad limit reached for your plan!", "info");
        return;
      }

      const adSettings = getAdSettings();
      let timeLeft = adSettings.adDurationSeconds || 15;
      const totalDuration = timeLeft;
      isWatchingAd = true;

      // Open sponsor url in new tab if configured
      if (adSettings.directUrl) {
        try { window.open(adSettings.directUrl, "_blank"); } catch (e) {}
      }

      document.getElementById("ad-standby-view").classList.add("hidden");
      document.getElementById("ad-completed-view").classList.add("hidden");
      document.getElementById("ad-running-view").classList.remove("hidden");
      const btn = document.getElementById("start-watch-ad-btn");
      if (btn) btn.disabled = true;

      clearInterval(adCountdownInterval);
      adCountdownInterval = setInterval(() => {
        timeLeft--;
        const countEl = document.getElementById("ad-countdown");
        const progEl = document.getElementById("ad-timer-progress");
        if (countEl) countEl.textContent = `${timeLeft}s`;
        if (progEl) progEl.style.width = `${Math.round((timeLeft / totalDuration) * 100)}%`;

        if (timeLeft <= 0) {
          clearInterval(adCountdownInterval);
          finishAdAndCredit();
        }
      }, 1000);
    }

    function finishAdAndCredit() {
      const current = getCurrentUser();
      if (!current) { isWatchingAd = false; return; }

      const total = current.planDailyAdLimit || 5;
      const watched = Number(current.adsWatchedToday) || 0;
      if (watched >= total) {
        isWatchingAd = false;
        showToast("Daily limit already reached!", "info");
        return;
      }

      const newWatched = watched + 1;
      const newBalUsd = (Number(current.balanceUsd) || 0) + 0.05;
      const newBalPkr = (Number(current.balancePkr) || 0) + 14;

      const users = getUsers();
      const u = users.find(x => x.id === current.id || x.identifier.toLowerCase() === current.identifier.toLowerCase());
      if (u) {
        u.adsWatchedToday = newWatched;
        u.balanceUsd = newBalUsd;
        u.balancePkr = newBalPkr;
        u.lastAdWatchTimestamp = Date.now();
        u.lastAdResetDate = new Date().toDateString();
        u.lastUpdatedAt = Date.now();
        saveUsers(users);
      }

      syncToCloud("ad_watched", { userId: current.id, adsWatchedToday: newWatched, balanceUsd: newBalUsd, balancePkr: newBalPkr });

      const runningView = document.getElementById("ad-running-view");
      const completedView = document.getElementById("ad-completed-view");
      if (runningView) runningView.classList.add("hidden");
      if (completedView) completedView.classList.remove("hidden");

      showToast("Ad completed! +$0.05 USD (14 PKR) added to balance.", "success");
      isWatchingAd = false;
      setTimeout(() => renderWatchScreen(), 1500);
    }

      if (!plan) return;

      if ((user.balanceUsd || 0) < plan.priceUsd) {
        showToast(`Insufficient balance! Deposit $${(plan.priceUsd - (user.balanceUsd || 0)).toFixed(2)} more.`, "error");
        setTimeout(() => switchScreen("deposit"), 1000);
        return;
      }

      if (!confirm(`Subscribe to ${plan.name} for $${plan.priceUsd.toFixed(2)} USD (${plan.pricePkr.toLocaleString()} PKR)?`)) {
        return;
      }

      const users = getUsers();
      const u = users.find(x => x.id === user.id);
      if (u) {
        u.balanceUsd = Math.max(0, (u.balanceUsd || 0) - plan.priceUsd);
        u.balancePkr = Math.max(0, u.balanceUsd * USD_TO_PKR);

        if (!Array.isArray(u.activePlans)) u.activePlans = [];
        u.activePlans.push({ planId: plan.id, name: plan.name, dailyAds: plan.dailyAds, subscribedAt: Date.now() });

        const totalDailyAds = u.activePlans.reduce((sum, p) => sum + (p.dailyAds || 0), 0);
        u.planDailyAdLimit = totalDailyAds;
        u.activePlanName = u.activePlans.map(p => p.name).join(" + ");
        u.activePlanId = plan.id;
        u.lastUpdatedAt = Date.now();

        saveUsers(users);
        syncToCloud("plan_purchased", { userId: u.id, planName: plan.name });
        showToast(`Subscribed to ${plan.name}! Your new daily limit is ${totalDailyAds} ads.`, "success");
        renderPlansScreen();
      }
    }

          <!-- Deposit Verification Form -->
          <form onsubmit="handleDepositSubmit(event)" class="bg-slate-900 border border-slate-800 rounded-2xl p-4 space-y-3">
            <h3 class="text-xs font-bold text-white">Submit Payment Details</h3>

            <button type="submit" class="w-full py-2.5 bg-gradient-to-r from-amber-500 to-orange-500 hover:from-amber-600 hover:to-orange-600 text-slate-950 font-black text-xs rounded-xl shadow-md transition">

    function handleDepositSubmit(e) {
      e.preventDefault();
      const user = getCurrentUser();
      if (!user) return;

      const amount = parseFloat(document.getElementById("deposit-amount").value);
      const tid = document.getElementById("deposit-tid").value.trim();
      if (!amount || amount <= 0 || !tid) {
        showToast("Please enter a valid amount and transaction proof!", "error");
        return;
      }

      const isUsdt = selectedDepositMethodKey === "usdt";
      const usdAmount = isUsdt ? amount : (amount / USD_TO_PKR);
      const pkrAmount = isUsdt ? (amount * USD_TO_PKR) : amount;

      const deposits = getDeposits();
      const newDep = {
        id: Date.now(),
        userId: user.id,
        userIdentifier: user.identifier,
        fullName: user.fullName || user.identifier,
        method: selectedDepositMethodKey,
        amount: amount,
        currency: isUsdt ? "USD" : "PKR",
        creditedUsd: usdAmount,
        creditedPkr: pkrAmount,
        tid: tid,
        status: "PENDING",
        createdAt: new Date().toLocaleString(),
        timestamp: Date.now()
      };

      deposits.push(newDep);
      saveDeposits(deposits);
      syncToCloud("new_deposit", newDep);
      showToast("Deposit request submitted! Admin will verify and credit your balance.", "success");
      switchScreen("dashboard");
    }

    // --- WITHDRAW SCREEN ---
    function renderWithdrawScreen() {

      if (!user) return switchScreen("auth");

      const container = document.getElementById("app-main-content");

          <div class="bg-slate-900 border border-slate-800 rounded-2xl p-4 flex justify-between items-center">
            <div>
              <h2 class="text-sm font-bold text-white">Withdraw Earnings</h2>

            <div class="text-right">

    function handleWithdrawSubmit(e) {
      e.preventDefault();
      const user = getCurrentUser();
      if (!user) return;

      const method = document.getElementById("withdraw-method").value;
      const amount = parseFloat(document.getElementById("withdraw-amount").value);
      const title = document.getElementById("withdraw-title").value.trim();
      const address = document.getElementById("withdraw-address").value.trim();

      if (!amount || amount < 3.57) {
        showToast("Minimum withdrawal is $3.57 USD (1,000 PKR)!", "error");
        return;
      }

      if ((user.balanceUsd || 0) < amount) {
        showToast("Insufficient balance to withdraw this amount!", "error");
        return;
      }

      const users = getUsers();
      const u = users.find(x => x.id === user.id);
      if (u) {
        u.balanceUsd = Math.max(0, (u.balanceUsd || 0) - amount);
        u.balancePkr = Math.max(0, u.balanceUsd * USD_TO_PKR);
        u.lastUpdatedAt = Date.now();
        saveUsers(users);
      }

      const withdrawals = getWithdrawals();
      const newWd = {
        id: Date.now(),
        userId: user.id,
        userIdentifier: user.identifier,
        fullName: user.fullName || user.identifier,
        method: method,
        amount: amount,
        currency: "USD",
        pkrAmount: amount * USD_TO_PKR,
        accountTitle: title,
        accountAddress: address,
        status: "PENDING",
        createdAt: new Date().toLocaleString(),
        timestamp: Date.now()
      };

      withdrawals.push(newWd);
      saveWithdrawals(withdrawals);
      syncToCloud("new_withdrawal", newWd);
      showToast("Withdrawal requested! Amount deducted and queued for transfer.", "success");
      switchScreen("dashboard");
    }

    // --- ADMIN PANEL SCREEN ---
    function renderAdminScreen() {
      const user = getCurrentUser();
      if (!user || (!user.isAdmin && user.identifier.toLowerCase() !== ADMIN_EMAIL.toLowerCase())) {
        return switchScreen("dashboard");
      }

      const users = getUsers();
      const deposits = getDeposits();
      const withdrawals = getWithdrawals();
      const pendingDeps = deposits.filter(d => d.status === "PENDING");
      const pendingWds = withdrawals.filter(w => w.status === "PENDING");

      const container = document.getElementById("app-main-content");
      container.innerHTML = `
        <div class="space-y-4">
          <div class="bg-gradient-to-r from-purple-900 via-indigo-900 to-slate-900 border border-purple-500/30 rounded-2xl p-4 flex justify-between items-center text-white">
            <div>
              <h2 class="text-sm font-black flex items-center gap-1.5"><i class="fa-solid fa-shield-halved text-purple-400"></i> Master Admin Portal</h2>
              <p class="text-[10px] text-purple-200">Real-time deposit approvals and user management</p>
            </div>
            <button onclick="syncFromCloud(false)" class="px-2.5 py-1 bg-purple-600/40 hover:bg-purple-600 rounded-lg text-xs font-bold border border-purple-400/30 transition flex items-center gap-1">
              <i id="admin-sync-icon" class="fa-solid fa-rotate text-[10px]"></i> Sync
            </button>
          </div>

          <!-- Pending Deposits Section -->
          <div class="bg-slate-900 border border-slate-800 rounded-2xl p-4 space-y-3">
            <h3 class="text-xs font-bold text-white flex justify-between items-center">
              <span>Pending Deposits (${pendingDeps.length})</span>
            </h3>
            ${pendingDeps.length === 0 ? '<p class="text-xs text-slate-500 py-2">No pending deposit requests.</p>' : `
              <div class="space-y-2">
                ${pendingDeps.map(d => `
                  <div class="p-3 bg-slate-950 rounded-xl border border-slate-800 space-y-2 text-xs">
                    <div class="flex justify-between items-center">
                      <span class="font-bold text-amber-400">${d.fullName || d.userIdentifier}</span>
                      <span class="font-black text-white">$${(d.creditedUsd || 0).toFixed(2)} USD</span>
                    </div>
                    <p class="text-[10px] text-slate-400 font-mono">TID: ${d.tid} (${d.method.toUpperCase()})</p>
                    <div class="flex gap-2 pt-1">
                      <button onclick="adminApproveDeposit(${d.id})" class="flex-1 py-1.5 bg-emerald-600 hover:bg-emerald-500 text-white font-bold rounded-lg text-[11px] transition">Approve & Credit</button>
                      <button onclick="adminRejectDeposit(${d.id})" class="flex-1 py-1.5 bg-rose-600 hover:bg-rose-500 text-white font-bold rounded-lg text-[11px] transition">Reject</button>
                    </div>
                  </div>
                `).join("")}
              </div>
            `}
          </div>

          <!-- Users List with Fix All & Edit Balance -->
          <div class="bg-slate-900 border border-slate-800 rounded-2xl p-4 space-y-3">
            <div id="admin-users-list" class="space-y-2"></div>
          </div>
        </div>
      `;

      const usersList = document.getElementById("admin-users-list");
      usersList.innerHTML = `
        <div class="flex justify-between items-center bg-slate-950 p-2.5 rounded-xl mb-2 border border-slate-800">
          <span class="text-[11px] font-bold text-slate-300"><i class="fa-solid fa-users text-amber-400 mr-1"></i> Total ${users.length} Users</span>
          <button onclick="adminFixAllUserBalances()" class="px-2.5 py-1 bg-gradient-to-r from-amber-500 to-orange-500 hover:from-amber-600 hover:to-orange-600 text-slate-950 rounded-lg text-[10px] font-black shadow-md flex items-center gap-1 transition-all">
            <i class="fa-solid fa-wand-magic-sparkles text-[10px]"></i> Fix All User Balances
          </button>
        </div>
      ` + users.map(u => `
        <div class="p-3 bg-slate-950 rounded-xl border border-slate-800 text-xs flex items-center justify-between gap-2">

            <p class="font-bold text-white truncate">${u.fullName || u.identifier} ${u.isAdmin || (u.identifier && u.identifier.toLowerCase() === ADMIN_EMAIL.toLowerCase()) ? '<span class="text-[9px] bg-purple-500/20 text-purple-300 px-1.5 py-0.5 rounded font-bold">Admin</span>' : ''}</p>
            <p class="text-[10px] text-slate-400 truncate">${u.identifier}</p>
            <p class="text-[10px] text-amber-400 font-semibold mt-0.5 truncate">Plan: ${u.activePlanName || 'None'}</p>
          </div>
          <div class="text-right flex flex-col items-end gap-1 flex-shrink-0">
            <div>
              <span class="font-black text-sm text-white">$${(Number(u.balanceUsd) || 0).toFixed(2)} USD</span>
              <span class="block text-[10px] text-slate-400">${Math.round(Number(u.balancePkr) || 0).toLocaleString()} PKR</span>
            </div>
            <button onclick="adminEditUserBalance('${u.id}')" class="px-2 py-0.5 bg-slate-800 hover:bg-amber-500 hover:text-slate-950 text-slate-300 rounded text-[10px] font-bold transition-all flex items-center gap-1">

        </div>
      `).join("");

    function adminApproveDeposit(id) {
      const deposits = getDeposits();
      const dep = deposits.find(d => d.id === id);
      if (!dep || dep.status !== "PENDING") return;

      dep.status = "APPROVED";
      saveDeposits(deposits);

      const users = getUsers();
      let user = users.find(u => u.id === dep.userId || (dep.userIdentifier && u.identifier.toLowerCase() === dep.userIdentifier.toLowerCase()));
      if (user) {
        user.balanceUsd = (Number(user.balanceUsd) || 0) + Number(dep.creditedUsd || 0);
        user.balancePkr = (Number(user.balancePkr) || 0) + Number(dep.creditedPkr || 0);
        user.lastUpdatedAt = Date.now();
        saveUsers(users);
      }

      syncToCloud("deposit_approved", { depositId: dep.id, userId: dep.userId });
      showToast(`Deposit of $${dep.creditedUsd.toFixed(2)} approved!`, "success");
      renderAdminScreen();
    }

    function adminRejectDeposit(id) {
      const deposits = getDeposits();
      const dep = deposits.find(d => d.id === id);
      if (!dep || dep.status !== "PENDING") return;

      dep.status = "REJECTED";
      saveDeposits(deposits);
      syncToCloud("deposit_rejected", { depositId: dep.id });
      showToast("Deposit request rejected.", "info");
      renderAdminScreen();
    }

    function adminEditUserBalance(userId) {
      const users = getUsers();
      const u = users.find(x => String(x.id) === String(userId));
      if (!u) return;

      const currentUsd = (Number(u.balanceUsd) || 0).toFixed(2);
      const input = prompt("Enter new Balance in USD for " + (u.fullName || u.identifier) + ":\n(Enter 0 to reset to zero)", currentUsd);
      if (input === null) return;

      const newUsd = parseFloat(input);
      if (isNaN(newUsd) || newUsd < 0) {
        showToast("Invalid balance amount entered.", "error");
        return;
      }

      u.balanceUsd = Math.round(newUsd * 100) / 100;
      u.balancePkr = Math.round(u.balanceUsd * USD_TO_PKR);
      u.lastUpdatedAt = Date.now();

      saveUsers(users);
      syncToCloud();
      showToast("Balance for " + (u.fullName || u.identifier) + " updated to $" + u.balanceUsd.toFixed(2) + " USD!", "success");
      renderAdminScreen();
    }

    function adminFixAllUserBalances() {
      if (!confirm("Are you sure you want to recalculate and fix all user balances?\nThis will deduct active plan costs from users balances while keeping all their plans active!")) {
        return;
      }

      const users = getUsers();
      const deposits = getDeposits();
      const withdrawals = getWithdrawals();
      let fixCount = 0;

      users.forEach(u => {
        if (u.isAdmin || (u.identifier && u.identifier.toLowerCase() === ADMIN_EMAIL.toLowerCase())) return;

        const userDeps = deposits.filter(d => (String(d.userId) === String(u.id) || (d.userIdentifier && u.identifier && d.userIdentifier.toLowerCase() === u.identifier.toLowerCase())) && d.status === "APPROVED");
        const totalDepositsUsd = userDeps.reduce((sum, d) => sum + (Number(d.creditedUsd) || 0), 0);

        let totalPlansCostUsd = 0;
        if (Array.isArray(u.activePlans) && u.activePlans.length > 0) {
          u.activePlans.forEach(p => {
            const planObj = VIP_PLANS.find(v => v.id === p.planId || v.name === p.name);
            if (planObj) totalPlansCostUsd += planObj.priceUsd;
          });
        } else if (u.activePlanId) {
          const planObj = VIP_PLANS.find(v => v.id === u.activePlanId);
          if (planObj) totalPlansCostUsd += planObj.priceUsd;
        }

        const adEarningsUsd = (Number(u.adsWatchedToday) || 0) * AD_REWARD_USD;
        const refEarningsUsd = Number(u.referralEarningsUsd) || 0;

        const userWds = withdrawals.filter(w => (String(w.userId) === String(u.id) || (w.userIdentifier && u.identifier && w.userIdentifier.toLowerCase() === u.identifier.toLowerCase())) && w.status !== "REJECTED");
        const totalWdsUsd = userWds.reduce((sum, w) => {
          const amt = Number(w.amount) || 0;
          return sum + (w.currency === "USD" ? amt : (amt / USD_TO_PKR));
        }, 0);

        const netUsd = Math.max(0, (totalDepositsUsd + adEarningsUsd + refEarningsUsd) - totalPlansCostUsd - totalWdsUsd);

        u.balanceUsd = Math.round(netUsd * 100) / 100;
        u.balancePkr = Math.round(u.balanceUsd * USD_TO_PKR);
        u.lastUpdatedAt = Date.now();
        fixCount++;
      });

      saveUsers(users);
      syncToCloud();
      showToast("Fixed balances for " + fixCount + " user accounts!", "success");
      renderAdminScreen();
    }

    function copyToClipboard(text) {
      if (!text) return;
      navigator.clipboard.writeText(text).then(() => {
        showToast("Copied to clipboard!", "success");
      }).catch(() => {
        showToast("Copied!", "success");
      });
    }

    function openNotificationModal() {
      const ann = getAnnouncement();
      if (ann && ann.message) {
        alert(`${ann.title || 'Announcement'}\n\n${ann.message}`);
      } else {
        showToast("No new announcements.", "info");
      }
    }

    // Initialize App On Load
    document.addEventListener("DOMContentLoaded", () => {
      const user = getCurrentUser();
      if (user) {
        switchScreen("dashboard");
      } else {
        switchScreen("auth");
      }
      syncFromCloud();
      cloudAutoSyncTimer = setInterval(() => syncFromCloud(true), 10000);
    });
  </script>
